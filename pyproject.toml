[project]
name = "discogs-musicbrainz-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Henry Oberholtzer", email = "henryoberholtzer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-dance>=7.1.0",
    "isocodes>=2026.9.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "python3-discogs-client>=2.10",
    "requests>=2.34.2",
    "requests-ratelimiter>=0.10.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.poe.tasks]
iso_free = "isocodes locales --keep en --yes"
type = "pyrefly check"
lint = "ruff check --fix"
test = "pytest"
validate = ["type", "lint", "test"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
