[project]
name = "discogs-musicbrainz-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Henry Oberholtzer", email = "henryoberholtzer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "isocodes>=2026.9.2",
    "python3-discogs-client>=2.10",
]

[project.scripts]
discogs-musicbrainz-cli = "discogs_musicbrainz_cli:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.poe.tasks]
iso_free = "isocodes locales --keep en --yes"
type = "pyrefly check"
lint = "ruff check --fix"
test = "pytest"
validate = ["type", "lint", "test"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
